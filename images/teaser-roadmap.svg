<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="340" height="240" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="340" height="240" fill="#f7f9fc"/>

  <!-- rail -->
  <line x1="46" y1="52" x2="46" y2="168" stroke="#dcdcdc" stroke-width="3"/>

  <!-- bars -->
  <rect x="64" y="48"  width="176" height="18" rx="9" fill="#2e8b57"/>
  <rect x="64" y="78"  width="176" height="18" rx="9" fill="#2e8b57"/>
  <rect x="64" y="108" width="176" height="18" rx="9" fill="#2e8b57"/>
  <rect x="64" y="138" width="118" height="18" rx="9" fill="#d98c00"/>
  <rect x="64" y="168" width="66"  height="18" rx="9" fill="#d6d6d6"/>

  <!-- dots -->
  <g>
    <circle cx="46" cy="57" r="9" fill="#2e8b57"/>
    <circle cx="46" cy="87" r="9" fill="#2e8b57"/>
    <circle cx="46" cy="117" r="9" fill="#2e8b57"/>
    <circle cx="46" cy="147" r="10" fill="#d98c00"/>
    <circle cx="46" cy="177" r="9" fill="#ffffff" stroke="#b4b4b4" stroke-width="2"/>
  </g>

  <!-- right status marks -->
  <g font-size="12" text-anchor="start">
    <text x="254" y="62"  fill="#2e8b57">已完成</text>
    <text x="254" y="92"  fill="#2e8b57">已完成</text>
    <text x="254" y="122" fill="#2e8b57">已完成</text>
    <text x="254" y="152" fill="#a06a10" font-weight="600">进行中</text>
    <text x="254" y="182" fill="#888">待开展</text>
  </g>

  <text x="170" y="212" font-size="26" font-weight="600" fill="#22303f" text-anchor="middle">五个阶段</text>
</svg>
