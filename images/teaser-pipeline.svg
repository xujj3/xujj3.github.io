<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="340" height="240" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="340" height="240" fill="#f7f9fc"/>

  <defs>
    <marker id="t2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- 5 boxes -->
  <g>
    <rect x="26"  y="72" width="48" height="48" rx="6" fill="#dce9f7" stroke="#7ba7d4" stroke-width="1.4"/>
    <rect x="88"  y="72" width="48" height="48" rx="6" fill="#dce9f7" stroke="#7ba7d4" stroke-width="1.4"/>
    <rect x="150" y="72" width="48" height="48" rx="6" fill="#dce9f7" stroke="#7ba7d4" stroke-width="1.4"/>
    <rect x="212" y="72" width="48" height="48" rx="6" fill="#dce9f7" stroke="#7ba7d4" stroke-width="1.4"/>
    <rect x="274" y="72" width="48" height="48" rx="6" fill="#dcf0e4" stroke="#6fb08b" stroke-width="1.4"/>
  </g>
  <g font-size="15" fill="#4a6a86" text-anchor="middle">
    <text x="50"  y="101">1</text>
    <text x="112" y="101">2</text>
    <text x="174" y="101">3</text>
    <text x="236" y="101">4</text>
  </g>
  <text x="298" y="101" font-size="15" fill="#3f6b55" text-anchor="middle">5</text>

  <!-- arrows -->
  <g stroke="#8a8a8a" stroke-width="2">
    <line x1="76"  y1="96" x2="85"  y2="96" marker-end="url(#t2)"/>
    <line x1="138" y1="96" x2="147" y2="96" marker-end="url(#t2)"/>
    <line x1="200" y1="96" x2="209" y2="96" marker-end="url(#t2)"/>
    <line x1="262" y1="96" x2="271" y2="96" marker-end="url(#t2)"/>
  </g>

  <!-- transformation arrows below -->
  <g font-size="11" fill="#8a6d3b" text-anchor="middle">
    <text x="170" y="146">抓取 → 分块 → 抽取 → 生成 → 判断</text>
  </g>

  <text x="170" y="212" font-size="26" font-weight="600" fill="#22303f" text-anchor="middle">五步管线</text>
