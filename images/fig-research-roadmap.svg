<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>

  <text x="28" y="40" font-size="20" font-weight="600" fill="#222">研究进展：五个阶段</text>
  <text x="28" y="64" font-size="13" fill="#777">前三阶段完成，第四阶段进行中，第五阶段待开展</text>

  <!-- vertical rail -->
  <line x1="56" y1="100" x2="56" y2="360" stroke="#dcdcdc" stroke-width="3"/>

  <!-- row 1 done -->
  <circle cx="56" cy="112" r="17" fill="#2e8b57"/>
  <text x="56" y="118" font-size="14" fill="#fff" text-anchor="middle">1</text>
  <text x="92" y="117" font-size="14" fill="#333">石墨烯与铜体相体系的弹道电导传输性质</text>
  <rect x="726" y="98" width="112" height="28" rx="14" fill="#e6f4ec" stroke="#2e8b57" stroke-width="1"/>
  <text x="782" y="117" font-size="12" fill="#2e8b57" text-anchor="middle">已完成</text>

  <!-- row 2 done -->
  <circle cx="56" cy="172" r="17" fill="#2e8b57"/>
  <text x="56" y="178" font-size="14" fill="#fff" text-anchor="middle">2</text>
  <text x="92" y="177" font-size="14" fill="#333">石墨烯 / 铜界面电子输运计算</text>
  <rect x="726" y="158" width="112" height="28" rx="14" fill="#e6f4ec" stroke="#2e8b57" stroke-width="1"/>
  <text x="782" y="177" font-size="12" fill="#2e8b57" text-anchor="middle">已完成</text>

  <!-- row 3 done -->
  <circle cx="56" cy="232" r="17" fill="#2e8b57"/>
  <text x="56" y="238" font-size="14" fill="#fff" text-anchor="middle">3</text>
  <text x="92" y="237" font-size="14" fill="#333">石墨烯常见散射机制对载流子迁移率的影响</text>
  <rect x="726" y="218" width="112" height="28" rx="14" fill="#e6f4ec" stroke="#2e8b57" stroke-width="1"/>
  <text x="782" y="237" font-size="12" fill="#2e8b57" text-anchor="middle">已完成</text>

  <!-- row 4 active -->
  <circle cx="56" cy="292" r="19" fill="#d98c00"/>
  <text x="56" y="298" font-size="14" fill="#fff" text-anchor="middle">4</text>
  <text x="92" y="291" font-size="14" font-weight="600" fill="#8a5a00">界面散射理论：折算为宏观参数 p、R<tspan font-size="10" baseline-shift="sub">gb</tspan></text>
  <text x="92" y="309" font-size="12" fill="#a06a10">当前工作位置 —— 从正演预测转向参数反演</text>
  <rect x="726" y="278" width="112" height="28" rx="14" fill="#fdf1dc" stroke="#d98c00" stroke-width="1.4"/>
  <text x="782" y="297" font-size="12" font-weight="600" fill="#a06a10" text-anchor="middle">进行中</text>

  <!-- row 5 todo -->
  <circle cx="56" cy="352" r="17" fill="#ffffff" stroke="#b4b4b4" stroke-width="2"/>
  <text x="56" y="358" font-size="14" fill="#9a9a9a" text-anchor="middle">5</text>
  <text x="92" y="357" font-size="14" fill="#888">参数代入宏观输运模型，与实验测量对照</text>
  <rect x="726" y="338" width="112" height="28" rx="14" fill="#f4f4f4" stroke="#b4b4b4" stroke-width="1"/>
  <text x="782" y="357" font-size="12" fill="#888" text-anchor="middle">待开展</text>

  <!-- footnote -->
  <line x1="28" y1="388" x2="872" y2="388" stroke="#e8e8e8" stroke-width="1"/>
  <text x="28" y="408" font-size="12" fill="#777">第五阶段含有限元 / 电磁仿真：目前无算例，未计入已完成工作。</text>
</svg>
